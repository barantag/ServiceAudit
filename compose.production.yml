name: serviceaudit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: serviceaudit:${SERVICEAUDIT_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SERVICEAUDIT_ORGANIZATION_ID: ${SERVICEAUDIT_ORGANIZATION_ID:?SERVICEAUDIT_ORGANIZATION_ID is required}
      SERVICEAUDIT_PUBLIC_ORIGIN: ${SERVICEAUDIT_PUBLIC_ORIGIN:?SERVICEAUDIT_PUBLIC_ORIGIN is required}
    expose:
      - "3000"
    networks:
      - edge
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PILOT_HOSTNAME: ${PILOT_HOSTNAME:?PILOT_HOSTNAME is required}
      PILOT_BASIC_AUTH_USERNAME: ${PILOT_BASIC_AUTH_USERNAME:?PILOT_BASIC_AUTH_USERNAME is required}
      PILOT_BASIC_AUTH_PASSWORD_HASH: ${PILOT_BASIC_AUTH_PASSWORD_HASH:?PILOT_BASIC_AUTH_PASSWORD_HASH is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy

  migrator:
    profiles: ["operations"]
    image: serviceaudit-migrator:${SERVICEAUDIT_IMAGE_TAG:-local}
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  database:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
